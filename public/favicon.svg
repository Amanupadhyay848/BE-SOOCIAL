<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4"/>
  
  <!-- Stylized Monogram "BS" -->
  <g fill="#FFFFFF">
    <!-- 'B' letterform -->
    <path d="M128 144 H240 C280 144 308 168 308 202 C308 226 292 244 268 252 C298 260 318 282 318 316 C318 356 284 380 238 380 H128 Z M192 196 V234 H234 C252 234 262 224 262 214 C262 204 252 196 234 196 Z M192 284 V328 H242 C262 328 272 318 272 306 C272 294 262 284 242 284 Z" />
  </g>
  
  <!-- Signature Electric Lime Cinema Flare Dot -->
  <circle cx="384" cy="156" r="32" fill="#C6FF3D" filter="url(#glow)"/>
  <circle cx="384" cy="156" r="24" fill="#C6FF3D"/>
  
  <!-- Subtle Cinematic Viewfinder Crosshairs -->
  <line x1="384" y1="108" x2="384" y2="128" stroke="#C6FF3D" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="384" y1="184" x2="384" y2="204" stroke="#C6FF3D" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="336" y1="156" x2="356" y2="156" stroke="#C6FF3D" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="412" y1="156" x2="432" y2="156" stroke="#C6FF3D" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
</svg>
